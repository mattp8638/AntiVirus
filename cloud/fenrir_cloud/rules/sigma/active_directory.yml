logsource: {category: identity, product: windows}
detection:
  selection:
    EventType: [ad.trust.created, ad.policy.kerberos_changed]
  condition: selection
level: medium
---
title: Security log cleared on a domain controller
id: fenrir-ad-log-cleared
tags: [attack.defense_evasion, attack.t1070.001]
logsource: {category: identity, product: windows}
detection:
  selection:
    EventType: ad.log.cleared
  condition: selection
