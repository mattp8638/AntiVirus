title: LSASS memory dump
id: fenrir-cred-lsass-dump
tags: [attack.credential_access, attack.t1003.001]
logsource: {category: process_creation, product: windows}
detection:
  comsvcs:
    CommandLine|contains|all: ['comsvcs', 'MiniDump']
  procdump:
    Image|endswith: ['\procdump.exe', '\procdump64.exe']
    CommandLine|contains: 'lsass'
  taskmgr_style:
    CommandLine|contains|all: ['lsass', '.dmp']
  condition: 1 of them
level: critical
---
title: Mimikatz command line
id: fenrir-cred-mimikatz
tags: [attack.credential_access, attack.t1003]
logsource: {category: process_creation}
detection:
  keywords:
    CommandLine|contains: ['sekurlsa::', 'lsadump::', 'kerberos::golden', 'privilege::debug', 'crypto::capi', 'dpapi::']
  condition: keywords
level: critical
---
title: Registry hive export (SAM / SECURITY / SYSTEM)
id: fenrir-cred-hive-save
tags: [attack.credential_access, attack.t1003.002]
logsource: {category: process_creation, product: windows}
detection:
  selection:
    CommandLine|contains|all: ['reg', 'save']
    CommandLine|contains: ['hklm\sam', 'hklm\security', 'hklm\system']
  condition: selection
level: high
---
title: NTDS.dit access via ntdsutil or shadow copy
id: fenrir-cred-ntds
tags: [attack.credential_access, attack.t1003.003]
logsource: {category: process_creation, product: windows}
detection:
  ntdsutil:
    CommandLine|contains|all: ['ntdsutil', 'ifm']
  copy:
    CommandLine|contains: '\Windows\NTDS\ntds.dit'
  condition: ntdsutil or copy
level: critical
---
title: Linux shadow file read by unexpected process
id: fenrir-cred-linux-shadow
tags: [attack.credential_access, attack.t1003.008]
logsource: {category: process_creation, product: linux}
detection:
  selection:
    CommandLine|contains: ['/etc/shadow', '/etc/gshadow']
  filter:
    ProcessName: ['passwd', 'chpasswd', 'useradd', 'usermod', 'unix_chkpwd', 'shadowconfig']
  condition: selection and not filter
level: high
---
title: Brute force (repeated authentication failures)
id: fenrir-cred-auth-failure
tags: [attack.credential_access, attack.t1110]
logsource: {category: authentication}
detection:
  failure:
    Status|contains: ['fail', 'denied', 'invalid']
  condition: failure
level: low
---
title: Brute force burst
id: fenrir-cred-bruteforce
tags: [attack.credential_access, attack.t1110]
correlation:
  type: event_count
  rules: [fenrir-cred-auth-failure]
  group-by: [TargetUserName]
  timespan: 5m
  condition: {gte: 10}
level: high
