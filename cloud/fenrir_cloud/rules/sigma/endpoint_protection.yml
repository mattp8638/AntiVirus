title: Attack surface reduction rule blocked a process
id: fenrir-protection-asr-block
description: The endpoint terminated a process that matched an attack surface reduction or ransomware tamper rule.
tags: [attack.execution, attack.t1204]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: ['asr.rule.blocked', 'asr.rule.block_failed']
  condition: selection
level: high
---
title: Attack surface reduction rule audit hit
id: fenrir-protection-asr-audit
description: A rule in audit mode matched. Review before switching the rule to block.
tags: [attack.execution]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'asr.rule.audited'
  condition: selection
level: low
---
title: Application control blocked a program
id: fenrir-protection-appcontrol
tags: [attack.execution, attack.t1204]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: ['appcontrol.blocked', 'appcontrol.block_failed']
  condition: selection
level: medium
---
title: Device control could not be applied
id: fenrir-protection-devicecontrol-failed
tags: [attack.defense_evasion, attack.t1562]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'devicecontrol.apply_failed'
  condition: selection
level: medium
---
title: User paused real-time protection
id: fenrir-protection-user-paused
description: A signed-in user paused real-time protection from the agent window (allowed by the experience.allowUserPause policy setting). It turns back on by itself.
tags: [attack.defense_evasion, attack.t1562.001]
logsource: {product: windows}
detection:
  selection:
    EventType: 'protection.paused'
  condition: selection
level: medium
---
title: Agent upgrade failed
id: fenrir-agent-upgrade-failed
description: A silent agent upgrade failed. The agent restarted the version that was installed; the payload includes the end of the installer log.
tags: [attack.defense_evasion]
logsource: {product: windows}
detection:
  selection:
    EventType: 'agent.update.failed'
  condition: selection
level: medium
---
title: Agent crashed
id: fenrir-agent-crashed
description: The endpoint agent crashed and Windows restarted it. The payload names the faulting code (module+offset frames) for the build that crashed.
tags: [attack.defense_evasion]
logsource: {product: windows}
detection:
  selection:
    EventType: 'agent.crashed'
  condition: selection
level: high
---
title: Malware found in process memory
id: fenrir-protection-memory-malware
description: The advanced memory scanner found a program image in unbacked executable memory that the engine identifies as malware (injected or unpacked in memory). The agent ends the process unless it is a Windows process.
tags: [attack.defense_evasion, attack.privilege_escalation, attack.t1055]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'asr.memory.malware'
  condition: selection
level: critical
---
title: Injected or unpacked code running from memory
id: fenrir-protection-memory-injected
description: An unsigned process holds a Windows program image in executable memory that no file backs (reflective DLL injection, process hollowing or in-memory unpacking). The engine did not identify it; investigate the process.
tags: [attack.defense_evasion, attack.t1055, attack.t1620]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'asr.memory.injected_code'
  condition: selection
falsepositives: [Software protectors and packers that unpack themselves in memory, some game anti-cheat]
level: high
---
title: Code running from memory inside a signed program
id: fenrir-protection-memory-injected-signed
description: A signed program holds a Windows program image in executable memory that no file backs. Some legitimate protected software does this; malware injecting into trusted programs does too.
tags: [attack.defense_evasion, attack.t1055]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'asr.memory.injected_code_signed'
  condition: selection
falsepositives: [Software protectors, DRM and anti-cheat components]
level: medium
---
title: Deception lure opened
id: fenrir-protection-deception-lure
description: A program opened one of the decoy credential files Fenrir plants (a fake password vault or credentials sheet). Nobody has a reason to open them; attackers and infostealers searching for credentials do.
tags: [attack.credential_access, attack.discovery, attack.t1552.001, attack.t1083]
logsource: {category: endpoint_protection}
detection:
  selection:
    EventType: 'asr.deception_lure.touched'
  condition: selection
falsepositives: [A person curious about a hidden file, backup or search tools not yet recognised]
level: high
