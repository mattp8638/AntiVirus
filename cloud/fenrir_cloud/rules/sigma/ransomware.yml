title: Shadow copy deletion
id: fenrir-ransom-shadowcopy
description: Deleting Volume Shadow Copies removes the easiest recovery path and is a near-universal ransomware precursor.
tags: [attack.impact, attack.t1490]
logsource: {category: process_creation, product: windows}
detection:
  vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all: ['delete', 'shadows']
  wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all: ['shadowcopy', 'delete']
  powershell:
    CommandLine|contains|all: ['Win32_ShadowCopy', 'Delete']
  vssadmin_resize:
    CommandLine|contains|all: ['vssadmin', 'resize', 'shadowstorage', 'maxsize=']
  condition: 1 of them
falsepositives: [Backup software maintenance (rare)]
level: critical
---
title: Backup catalog or recovery disabled
id: fenrir-ransom-recovery-disabled
description: wbadmin catalog deletion or bcdedit disabling recovery mode.
tags: [attack.impact, attack.t1490]
logsource: {category: process_creation, product: windows}
detection:
  wbadmin:
    CommandLine|contains|all: ['wbadmin', 'delete']
    CommandLine|contains: ['catalog', 'systemstatebackup', 'backup']
  bcdedit:
    CommandLine|contains|all: ['bcdedit', '/set']
    CommandLine|contains: ['recoveryenabled no', 'bootstatuspolicy ignoreallfailures']
  condition: wbadmin or bcdedit
level: critical
---
title: Free-space wipe with cipher
id: fenrir-ransom-cipher-wipe
tags: [attack.impact, attack.t1485]
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith: '\cipher.exe'
    CommandLine|contains: ' /w:'
  condition: selection
level: high
---
title: Ransom note written
id: fenrir-ransom-note
description: Common ransom note file names created on disk.
tags: [attack.impact, attack.t1486]
logsource: {category: file_event}
detection:
  selection:
    TargetFilename|endswith:
      - '\README_TO_DECRYPT.txt'
      - '\HOW_TO_DECRYPT.txt'
      - '\DECRYPT_INSTRUCTIONS.html'
      - '\RESTORE_FILES.txt'
      - '\_readme.txt'
      - 'readme.lockbit.txt'
      - '\HOW_TO_RECOVER_DATA.html'
      - '/README_TO_DECRYPT.txt'
      - '/HOW_TO_DECRYPT.txt'
  condition: selection
level: high
---
title: File renamed to a ransomware extension
id: fenrir-ransom-extension
tags: [attack.impact, attack.t1486]
logsource: {category: file_event}
detection:
  selection:
    TargetFilename|endswith: ['.locked', '.encrypted', '.crypt', '.lockbit', '.akira', '.blackcat', '.royal', '.conti', '.ryk', '.basta', '.play', '.8base', '.medusa']
  condition: selection
level: medium
---
title: Mass file encryption (ransomware behaviour)
id: fenrir-ransom-mass-encryption
description: One process renamed or rewrote files to ransomware extensions 25+ times inside a minute.
tags: [attack.impact, attack.t1486]
correlation:
  type: event_count
  rules: [fenrir-ransom-extension]
  group-by: [ProcessId, Image]
  timespan: 1m
  condition: {gte: 25}
level: critical
---
title: Ransomware canary file touched
id: fenrir-ransom-canary
description: The agent's hidden canary files were modified. Legitimate software never touches them.
tags: [attack.impact, attack.t1486]
logsource: {category: ransomware}
detection:
  canary:
    EventType|contains: ['canary', 'honeyfile']
  condition: canary
level: critical
---
title: Agent ransomware shield verdict
id: fenrir-ransom-agent-verdict
tags: [attack.impact, attack.t1486]
logsource: {category: ransomware}
detection:
  selection:
    EventType|contains: ['ransomware.detected', 'ransomware.blocked', 'ransomware.rollback']
  condition: selection
level: critical
---
title: High-entropy rewrite burst
id: fenrir-ransom-entropy
tags: [attack.impact, attack.t1486]
logsource: {category: file_event}
detection:
  selection:
    Entropy|gte: 7.6
    FileCount|gte: 20
  condition: selection
level: high
---
title: Unapproved program wrote to a protected folder
id: fenrir-ransom-protected-folder
description: An unsigned program that is not on the ransomware allowed-apps list changed files in a protected folder.
tags: [attack.impact, attack.t1565]
logsource: {category: ransomware}
detection:
  selection:
    EventType|contains: ['ransomware.protected_folder']
  condition: selection
falsepositives: [Portable or in-house tools that save into Documents; add them to the allowed apps]
level: medium
