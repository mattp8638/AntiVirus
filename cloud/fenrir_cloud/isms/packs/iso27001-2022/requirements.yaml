# Clauses 4 to 10 (mandatory, with original guidance) and the 93 Annex A controls (identifiers and short titles).
- ref: "4.1"
  group: clause-4
  short_title: "Understanding the organization and its context"
  mandatory: true
  guidance: "Record the internal and external issues that affect what the ISMS must achieve, including whether climate change is a relevant issue, and review them when things change."
  licence: id-and-title
- ref: "4.2"
  group: clause-4
  short_title: "Understanding the needs and expectations of interested parties"
  mandatory: true
  guidance: "List the people and bodies with an interest in information security, what they require (including any climate related requirements) and which of those requirements the ISMS will address."
  licence: id-and-title
- ref: "4.3"
  group: clause-4
  short_title: "Determining the scope of the information security management system"
  mandatory: true
  guidance: "Write down what the ISMS covers: which parts of the organization, which sites and services, and where it stops. Record the interfaces with things outside the scope."
  licence: id-and-title
- ref: "4.4"
  group: clause-4
  short_title: "Information security management system"
  mandatory: true
  guidance: "Set up the ISMS as a set of connected processes, then run, maintain and improve it."
  licence: id-and-title
- ref: "5.1"
  group: clause-5
  short_title: "Leadership and commitment"
  mandatory: true
  guidance: "Top management shows it backs the ISMS: it sets direction, provides resources, links security to business processes and holds people to account."
  licence: id-and-title
- ref: "5.2"
  group: clause-5
  short_title: "Policy"
  mandatory: true
  guidance: "Top management sets an information security policy that fits the organization, commits to meeting requirements and to improvement, and makes sure staff know about it."
  licence: id-and-title
- ref: "5.3"
  group: clause-5
  short_title: "Organizational roles, responsibilities and authorities"
  mandatory: true
  guidance: "Assign and communicate who is responsible for the ISMS conforming and for reporting on its performance to top management."
  licence: id-and-title
- ref: "6.1.1"
  group: clause-6
  short_title: "Actions to address risks and opportunities: general"
  mandatory: true
  guidance: "Work out the risks and opportunities that could stop the ISMS achieving its outcomes, and plan how to deal with them."
  licence: id-and-title
- ref: "6.1.2"
  group: clause-6
  short_title: "Information security risk assessment"
  mandatory: true
  guidance: "Define and use a repeatable way to identify, analyse and evaluate information security risks, with criteria for acceptance, and keep the results."
  licence: id-and-title
- ref: "6.1.3"
  group: clause-6
  short_title: "Information security risk treatment"
  mandatory: true
  guidance: "Decide how each assessed risk will be treated, choose the controls needed, compare them with Annex A, produce the Statement of Applicability and get risk owners to approve the treatment plan and residual risk."
  licence: id-and-title
- ref: "6.2"
  group: clause-6
  short_title: "Information security objectives and planning to achieve them"
  mandatory: true
  guidance: "Set measurable security objectives, decide what will be done, by whom and by when, and how results will be judged."
  licence: id-and-title
- ref: "6.3"
  group: clause-6
  short_title: "Planning of changes"
  mandatory: true
  guidance: "Plan changes to the ISMS before making them, and keep a record."
  licence: id-and-title
- ref: "7.1"
  group: clause-7
  short_title: "Resources"
  mandatory: true
  guidance: "Provide the people, budget and tools the ISMS needs."
  licence: id-and-title
- ref: "7.2"
  group: clause-7
  short_title: "Competence"
  mandatory: true
  guidance: "Decide what competence each security role needs, make sure people have it, and keep evidence."
  licence: id-and-title
- ref: "7.3"
  group: clause-7
  short_title: "Awareness"
  mandatory: true
  guidance: "Make sure staff know the policy, how they contribute and what happens if they do not follow it."
  licence: id-and-title
- ref: "7.4"
  group: clause-7
  short_title: "Communication"
  mandatory: true
  guidance: "Decide what to communicate about security, when, to whom and how."
  licence: id-and-title
- ref: "7.5.1"
  group: clause-7
  short_title: "Documented information: general"
  mandatory: true
  guidance: "Keep the documents the standard requires and any others the ISMS needs to be effective."
  licence: id-and-title
- ref: "7.5.2"
  group: clause-7
  short_title: "Creating and updating"
  mandatory: true
  guidance: "Give documents proper identification, format and review and approval before use."
  licence: id-and-title
- ref: "7.5.3"
  group: clause-7
  short_title: "Control of documented information"
  mandatory: true
  guidance: "Control who can see and change documents, keep versions, and keep them available and protected."
  licence: id-and-title
- ref: "8.1"
  group: clause-8
  short_title: "Operational planning and control"
  mandatory: true
  guidance: "Plan and run the processes the ISMS needs, keep evidence that they ran as planned, and control outsourced processes."
  licence: id-and-title
- ref: "8.2"
  group: clause-8
  short_title: "Information security risk assessment"
  mandatory: true
  guidance: "Repeat risk assessments at planned intervals and after significant change, and keep the results."
  licence: id-and-title
- ref: "8.3"
  group: clause-8
  short_title: "Information security risk treatment"
  mandatory: true
  guidance: "Carry out the risk treatment plan and keep the results."
  licence: id-and-title
- ref: "9.1"
  group: clause-9
  short_title: "Monitoring, measurement, analysis and evaluation"
  mandatory: true
  guidance: "Decide what to measure, how and when, and evaluate the results to judge security performance."
  licence: id-and-title
- ref: "9.2.1"
  group: clause-9
  short_title: "Internal audit: general"
  mandatory: true
  guidance: "Run internal audits at planned intervals to check the ISMS meets requirements and works in practice."
  licence: id-and-title
- ref: "9.2.2"
  group: clause-9
  short_title: "Internal audit programme"
  mandatory: true
  guidance: "Plan an audit programme with criteria, scope, impartial auditors and reporting to management."
  licence: id-and-title
- ref: "9.3.1"
  group: clause-9
  short_title: "Management review: general"
  mandatory: true
  guidance: "Top management reviews the ISMS at planned intervals."
  licence: id-and-title
- ref: "9.3.2"
  group: clause-9
  short_title: "Management review inputs"
  mandatory: true
  guidance: "Cover the required topics in each review, including changes, feedback, performance trends, audit results and risk status."
  licence: id-and-title
- ref: "9.3.3"
  group: clause-9
  short_title: "Management review results"
  mandatory: true
  guidance: "Record decisions on improvement and any changes needed to the ISMS."
  licence: id-and-title
- ref: "10.1"
  group: clause-10
  short_title: "Continual improvement"
  mandatory: true
  guidance: "Keep improving how suitable, adequate and effective the ISMS is."
  licence: id-and-title
- ref: "10.2"
  group: clause-10
  short_title: "Nonconformity and corrective action"
  mandatory: true
  guidance: "When something does not conform, fix it, find the cause, act to stop it recurring and check the action worked."
  licence: id-and-title
