id: credential-theft-response
name: Credential Theft Response
incident_type: credential_access
lifecycle_framework: Fenrir Incident Lifecycle
default_severity: high
match_mitre: [T1003, T1003.001, T1003.002, T1003.003, T1110, T1056.002]

stages:
  detection:
    objective: Record which credential store was accessed and by which process and user.
  triage:
    objective: Determine whether dumping succeeded and which accounts were exposed.
  scoping:
    objective: Search for logons by exposed accounts from unusual devices since the detection time.
  containment:
    objective: Isolate the device and reset exposed passwords; revoke sessions and tokens.
  eradication:
    objective: Remove the dumping tool and any persistence; rotate the local admin password.
  verification:
    objective: No further LSASS access or anomalous logons for 48 hours.
  reporting:
    objective: Record exposed accounts and resets performed.

key_questions:
  - q_privileged_user
  - q_domain_controller
  - q_lateral_movement

critical_closure_gates:
  - Exposed accounts reset.
  - Kerberos tickets and cloud sessions revoked for exposed accounts.
  - Local admin password rotated.
