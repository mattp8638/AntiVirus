key: iso-27001
name: ISO/IEC 27001:2022
short: ISO 27001
version: "2022"
description: >-
  The international standard for an information security management system (ISMS). Clauses 4-10 are mandatory
  management-system requirements; Annex A lists 93 controls, applied as justified in the Statement of Applicability.
  Requirement wording is paraphrased; the standard itself is published by ISO.
sections:
  - id: "4"
    title: "Clause 4: Context of the organisation"
    requirements:
      - [ "4.1", "Understanding the organisation and its context", "Identify the internal and external issues that affect the ISMS's ability to achieve its intended outcomes.", ["Context / SWOT analysis"] ]
      - [ "4.2", "Needs and expectations of interested parties", "List interested parties (customers, regulators, staff, suppliers), their information security requirements, and which you address through the ISMS.", ["Interested parties register"] ]
      - [ "4.3", "Scope of the ISMS", "Define and document the boundaries and applicability of the ISMS, including interfaces and dependencies.", ["ISMS scope statement"] ]
      - [ "4.4", "Information security management system", "Establish, implement, maintain and continually improve the ISMS and the processes it needs.", ["ISMS manual or overview"] ]
  - id: "5"
    title: "Clause 5: Leadership"
    requirements:
      - [ "5.1", "Leadership and commitment", "Top management demonstrates commitment: policy and objectives aligned with strategy, resources, communication and support for improvement.", ["Board minutes", "Signed policy"] ]
      - [ "5.2", "Information security policy", "Top management establishes an information security policy with objectives and commitments, communicated and available.", ["Approved information security policy"] ]
      - [ "5.3", "Roles, responsibilities and authorities", "Assign and communicate ISMS responsibilities, including reporting on ISMS performance.", ["RACI / roles document"] ]
  - id: "6"
    title: "Clause 6: Planning"
    requirements:
      - [ "6.1.1", "Actions to address risks and opportunities", "Plan actions that address risks and opportunities to the ISMS's intended outcomes.", ["Risk management procedure"] ]
      - [ "6.1.2", "Information security risk assessment", "Define and apply a repeatable risk assessment process with acceptance criteria; identify, analyse and evaluate risks and their owners.", ["Risk assessment methodology", "Risk register"] ]
      - [ "6.1.3", "Information security risk treatment", "Select treatment options and controls, compare with Annex A, produce a Statement of Applicability and a risk treatment plan approved by risk owners.", ["Statement of Applicability", "Risk treatment plan"] ]
      - [ "6.2", "Information security objectives", "Set measurable information security objectives and plan how to achieve them.", ["Objectives with metrics"] ]
      - [ "6.3", "Planning of changes", "Carry out changes to the ISMS in a planned manner.", ["Change log for the ISMS"] ]
  - id: "7"
    title: "Clause 7: Support"
    requirements:
      - [ "7.1", "Resources", "Provide the resources needed for the ISMS.", ["Budget / resourcing plan"] ]
      - [ "7.2", "Competence", "Ensure people doing ISMS work are competent and keep evidence of competence.", ["Training records", "Job descriptions"] ]
      - [ "7.3", "Awareness", "Staff are aware of the policy, their contribution and the consequences of not conforming.", ["Awareness training completion"] ]
      - [ "7.4", "Communication", "Decide what, when, with whom and how to communicate about the ISMS.", ["Communication plan"] ]
      - [ "7.5", "Documented information", "Create, control, protect and retain the documented information the standard and the ISMS need.", ["Document control procedure"] ]
  - id: "8"
    title: "Clause 8: Operation"
    requirements:
      - [ "8.1", "Operational planning and control", "Plan, implement and control the processes needed to meet requirements, including outsourced processes.", ["Operating procedures"] ]
      - [ "8.2", "Information security risk assessment (performed)", "Perform risk assessments at planned intervals and when significant changes occur, and keep the results.", ["Dated risk assessment results"] ]
      - [ "8.3", "Information security risk treatment (performed)", "Implement the risk treatment plan and keep the results.", ["Treatment plan progress"] ]
  - id: "9"
    title: "Clause 9: Performance evaluation"
    requirements:
      - [ "9.1", "Monitoring, measurement, analysis and evaluation", "Decide what to measure, how and when, and evaluate ISMS performance and effectiveness.", ["Security metrics / KPI report"] ]
      - [ "9.2", "Internal audit", "Run an internal audit programme at planned intervals and report results to management.", ["Internal audit programme", "Audit reports"] ]
      - [ "9.3", "Management review", "Top management reviews the ISMS at planned intervals with the required inputs and records decisions.", ["Management review minutes"] ]
  - id: "10"
    title: "Clause 10: Improvement"
    requirements:
      - [ "10.1", "Continual improvement", "Continually improve the suitability, adequacy and effectiveness of the ISMS.", ["Improvement log"] ]
      - [ "10.2", "Nonconformity and corrective action", "React to nonconformities, find root causes, take corrective action and keep records.", ["Corrective action register"] ]
  - id: "A.5"
    title: "Annex A 5: Organisational controls"
    requirements:
      - [ "A.5.1", "Policies for information security", "Define, approve, publish, communicate and review the information security policy and topic-specific policies." ]
      - [ "A.5.2", "Information security roles and responsibilities", "Define and allocate information security roles and responsibilities." ]
      - [ "A.5.3", "Segregation of duties", "Separate conflicting duties and areas of responsibility." ]
      - [ "A.5.4", "Management responsibilities", "Management requires all personnel to apply information security in line with policy." ]
      - [ "A.5.5", "Contact with authorities", "Establish and maintain contact with relevant authorities." ]
      - [ "A.5.6", "Contact with special interest groups", "Maintain contact with security forums and professional associations." ]
      - [ "A.5.7", "Threat intelligence", "Collect and analyse information about information security threats." ]
      - [ "A.5.8", "Information security in project management", "Integrate information security into project management." ]
      - [ "A.5.9", "Inventory of information and other associated assets", "Keep an inventory of information and associated assets, with owners." ]
      - [ "A.5.10", "Acceptable use of information and other associated assets", "Document and implement rules for acceptable use and handling." ]
      - [ "A.5.11", "Return of assets", "Personnel return organisational assets on change or end of employment." ]
      - [ "A.5.12", "Classification of information", "Classify information by confidentiality, integrity, availability and stakeholder requirements." ]
      - [ "A.5.13", "Labelling of information", "Label information according to the classification scheme." ]
      - [ "A.5.14", "Information transfer", "Have rules, procedures or agreements for all types of information transfer." ]
      - [ "A.5.15", "Access control", "Establish rules to control physical and logical access based on business and security requirements." ]
      - [ "A.5.16", "Identity management", "Manage the full life cycle of identities." ]
      - [ "A.5.17", "Authentication information", "Control the allocation and management of authentication information, including advising users." ]
      - [ "A.5.18", "Access rights", "Provision, review, modify and remove access rights according to policy." ]
      - [ "A.5.19", "Information security in supplier relationships", "Manage the security risks of using suppliers' products or services." ]
      - [ "A.5.20", "Addressing information security within supplier agreements", "Agree relevant security requirements with each supplier." ]
      - [ "A.5.21", "Managing information security in the ICT supply chain", "Manage security risks in the ICT product and service supply chain." ]
      - [ "A.5.22", "Monitoring, review and change management of supplier services", "Regularly monitor, review, evaluate and manage change in supplier security practices." ]
      - [ "A.5.23", "Information security for use of cloud services", "Define processes to acquire, use, manage and exit cloud services." ]
      - [ "A.5.24", "Incident management planning and preparation", "Plan and prepare for incident management with defined processes, roles and responsibilities." ]
      - [ "A.5.25", "Assessment and decision on information security events", "Assess events and decide whether they are incidents." ]
      - [ "A.5.26", "Response to information security incidents", "Respond to incidents according to documented procedures." ]
      - [ "A.5.27", "Learning from information security incidents", "Use knowledge from incidents to strengthen controls." ]
      - [ "A.5.28", "Collection of evidence", "Identify, collect, acquire and preserve evidence related to security events." ]
      - [ "A.5.29", "Information security during disruption", "Maintain information security at an appropriate level during disruption." ]
      - [ "A.5.30", "ICT readiness for business continuity", "Plan, implement, maintain and test ICT readiness against continuity objectives." ]
      - [ "A.5.31", "Legal, statutory, regulatory and contractual requirements", "Identify, document and keep up to date the relevant requirements and your approach to meeting them." ]
      - [ "A.5.32", "Intellectual property rights", "Implement procedures to protect intellectual property rights." ]
      - [ "A.5.33", "Protection of records", "Protect records from loss, destruction, falsification and unauthorised access or release." ]
      - [ "A.5.34", "Privacy and protection of PII", "Identify and meet requirements for privacy and protection of personal data." ]
      - [ "A.5.35", "Independent review of information security", "Review the approach to information security independently at planned intervals or after significant change." ]
      - [ "A.5.36", "Compliance with policies, rules and standards", "Regularly review compliance with the information security policy and standards." ]
      - [ "A.5.37", "Documented operating procedures", "Document operating procedures for information processing facilities and make them available." ]
  - id: "A.6"
    title: "Annex A 6: People controls"
    requirements:
      - [ "A.6.1", "Screening", "Carry out background verification checks before joining and on an ongoing basis, proportionate to risk." ]
      - [ "A.6.2", "Terms and conditions of employment", "Employment contracts state personnel and organisational security responsibilities." ]
      - [ "A.6.3", "Information security awareness, education and training", "Provide appropriate awareness, education and training, with regular updates." ]
      - [ "A.6.4", "Disciplinary process", "Formalise and communicate a disciplinary process for policy violations." ]
      - [ "A.6.5", "Responsibilities after termination or change of employment", "Define, enforce and communicate responsibilities that remain after leaving or changing role." ]
      - [ "A.6.6", "Confidentiality or non-disclosure agreements", "Identify, document, review and have signed confidentiality agreements." ]
      - [ "A.6.7", "Remote working", "Implement security measures for people working remotely." ]
      - [ "A.6.8", "Information security event reporting", "Provide a way for personnel to report observed or suspected security events promptly." ]
  - id: "A.7"
    title: "Annex A 7: Physical controls"
    requirements:
      - [ "A.7.1", "Physical security perimeters", "Define and use security perimeters to protect areas containing information and assets." ]
      - [ "A.7.2", "Physical entry", "Protect secure areas with entry controls and access points." ]
      - [ "A.7.3", "Securing offices, rooms and facilities", "Design and implement physical security for offices, rooms and facilities." ]
      - [ "A.7.4", "Physical security monitoring", "Continuously monitor premises for unauthorised physical access." ]
      - [ "A.7.5", "Protecting against physical and environmental threats", "Protect against natural disasters, attacks and accidents to infrastructure." ]
      - [ "A.7.6", "Working in secure areas", "Design and implement security measures for working in secure areas." ]
      - [ "A.7.7", "Clear desk and clear screen", "Define and enforce clear desk and clear screen rules." ]
      - [ "A.7.8", "Equipment siting and protection", "Site equipment securely and protect it." ]
      - [ "A.7.9", "Security of assets off-premises", "Protect assets used off-site." ]
      - [ "A.7.10", "Storage media", "Manage storage media through acquisition, use, transport and disposal." ]
      - [ "A.7.11", "Supporting utilities", "Protect facilities from power failures and other utility disruptions." ]
      - [ "A.7.12", "Cabling security", "Protect power and data cables from interception, interference or damage." ]
      - [ "A.7.13", "Equipment maintenance", "Maintain equipment correctly to ensure availability, integrity and confidentiality." ]
      - [ "A.7.14", "Secure disposal or re-use of equipment", "Verify that sensitive data and licensed software are removed or overwritten before disposal or re-use." ]
  - id: "A.8"
    title: "Annex A 8: Technological controls"
    requirements:
      - [ "A.8.1", "User endpoint devices", "Protect information stored on, processed by or accessible via user endpoint devices.", [], ["iso-27001/A.8.1"] ]
      - [ "A.8.2", "Privileged access rights", "Restrict and manage the allocation and use of privileged access rights.", [], ["iso-27001/A.8.2"] ]
      - [ "A.8.3", "Information access restriction", "Restrict access to information and assets according to the access control policy." ]
      - [ "A.8.4", "Access to source code", "Manage read and write access to source code, development tools and software libraries." ]
      - [ "A.8.5", "Secure authentication", "Implement secure authentication technologies and procedures (such as MFA) based on access restrictions." ]
      - [ "A.8.6", "Capacity management", "Monitor and adjust resource use in line with current and expected capacity requirements." ]
      - [ "A.8.7", "Protection against malware", "Implement protection against malware, supported by user awareness.", [], ["iso-27001/A.8.7"] ]
      - [ "A.8.8", "Management of technical vulnerabilities", "Obtain information about technical vulnerabilities, evaluate exposure and take appropriate measures.", [], ["iso-27001/A.8.8"] ]
      - [ "A.8.9", "Configuration management", "Establish, document, implement, monitor and review secure configurations." ]
      - [ "A.8.10", "Information deletion", "Delete information in systems, devices and media when no longer required." ]
      - [ "A.8.11", "Data masking", "Use data masking in line with access control and business requirements." ]
      - [ "A.8.12", "Data leakage prevention", "Apply data leakage prevention to systems, networks and devices that hold sensitive information.", [], ["iso-27001/A.8.12"] ]
      - [ "A.8.13", "Information backup", "Maintain and regularly test backups of information, software and systems." ]
      - [ "A.8.14", "Redundancy of information processing facilities", "Implement sufficient redundancy to meet availability requirements." ]
      - [ "A.8.15", "Logging", "Produce, store, protect and analyse logs that record activities, exceptions, faults and events.", [], ["iso-27001/A.8.15"] ]
      - [ "A.8.16", "Monitoring activities", "Monitor networks, systems and applications for anomalous behaviour and act on potential incidents.", [], ["iso-27001/A.8.16"] ]
      - [ "A.8.17", "Clock synchronisation", "Synchronise system clocks to approved time sources." ]
      - [ "A.8.18", "Use of privileged utility programs", "Restrict and tightly control utility programs that can override system and application controls." ]
      - [ "A.8.19", "Installation of software on operational systems", "Manage software installation on operational systems securely." ]
      - [ "A.8.20", "Networks security", "Secure, manage and control networks and network devices.", [], ["iso-27001/A.8.20"] ]
      - [ "A.8.21", "Security of network services", "Identify, implement and monitor security mechanisms and service levels for network services." ]
      - [ "A.8.22", "Segregation of networks", "Segregate groups of information services, users and systems in networks." ]
      - [ "A.8.23", "Web filtering", "Manage access to external websites to reduce exposure to malicious content.", [], ["iso-27001/A.8.23"] ]
      - [ "A.8.24", "Use of cryptography", "Define and implement rules for effective use of cryptography, including key management." ]
      - [ "A.8.25", "Secure development life cycle", "Establish and apply rules for secure development of software and systems." ]
      - [ "A.8.26", "Application security requirements", "Identify, specify and approve security requirements when developing or acquiring applications." ]
      - [ "A.8.27", "Secure system architecture and engineering principles", "Establish, document, maintain and apply secure engineering principles." ]
      - [ "A.8.28", "Secure coding", "Apply secure coding principles to software development." ]
      - [ "A.8.29", "Security testing in development and acceptance", "Define and implement security testing processes in the development life cycle." ]
      - [ "A.8.30", "Outsourced development", "Direct, monitor and review outsourced system development." ]
      - [ "A.8.31", "Separation of development, test and production environments", "Separate and secure development, testing and production environments." ]
      - [ "A.8.32", "Change management", "Subject changes to information processing facilities and systems to change management procedures." ]
      - [ "A.8.33", "Test information", "Select, protect and manage test information appropriately." ]
      - [ "A.8.34", "Protection of information systems during audit testing", "Plan and agree audit tests and other assurance activities involving operational systems." ]
