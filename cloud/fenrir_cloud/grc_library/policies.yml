# Policy templates. {{organisation}}, {{owner}}, {{securityContact}}, {{reviewMonths}} and {{effectiveDate}} are filled
# in when a customer adopts a template; everything stays editable. "maps" says which requirements each policy
# answers, per framework, so a requirement shows its policy and whether that policy is approved.
- key: information-security
  title: Information Security Policy
  summary: The top-level policy - commitment, scope, objectives, roles and how the other policies fit together.
  maps:
    iso-27001: ["5.1", "5.2", "5.3", "6.2", "7.3", "A.5.1", "A.5.2", "A.5.4", "A.5.36"]
    soc2: ["CC1.1", "CC1.3", "CC2.2", "CC5.3"]
    nist-csf-2: ["GV.PO", "GV.RR"]
    ncsc-caf: ["A1.a", "A1.b", "B1.a", "B1.b"]
    uk-gdpr: ["Art.5(2)"]
    govs-007: ["G007-GOV"]
    nis2: ["NIS2-20","NIS2-21a"]
    dora: ["DORA-GOV"]
    def-stan-05-138: ["CSM-BASELINE"]
  body: |
    # Information Security Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Effective:** {{effectiveDate}}  **Review:** every {{reviewMonths}} months

    ## 1. Purpose
    {{organisation}} protects the confidentiality, integrity and availability of the information it holds for its customers, staff and partners. This policy sets out our commitment and the framework of policies, roles and controls that deliver it.

    ## 2. Scope
    All staff, contractors and third parties who use {{organisation}}'s information, systems, devices, premises and cloud services.

    ## 3. Commitment
    Senior management approves this policy, provides the resources needed, and reviews information security performance at least annually. We meet applicable legal, regulatory and contractual requirements and continually improve our controls.

    ## 4. Objectives
    - No unauthorised disclosure of customer or personal data.
    - Every device protected by malware protection, a firewall and current security updates.
    - Every user with their own account and multi-factor authentication on cloud services.
    - Incidents reported, contained and learned from.

    Objectives are measured and reported to management.

    ## 5. Roles and responsibilities
    - **{{owner}}** owns this policy and the information security programme.
    - **Managers** make sure their teams follow these policies.
    - **Everyone** protects information, follows these policies and reports suspected incidents to {{securityContact}} immediately.

    ## 6. Supporting policies
    Acceptable Use, Access Control, Passwords and Authentication, Asset Management, Patch and Vulnerability Management, Malware Protection, Network Security, Secure Configuration, Backup, Incident Response, Business Continuity, Supplier Security, Data Protection, Data Retention, Remote Working and Mobile Devices, Cryptography, Logging and Monitoring, Change Management, Risk Management, HR Security, Physical Security and Secure Development.

    ## 7. Compliance
    Breaches of this policy may lead to disciplinary action. Exceptions must be approved in writing by {{owner}} and recorded with a review date.
- key: acceptable-use
  title: Acceptable Use Policy
  summary: What staff may and may not do with company devices, accounts, email, internet and data.
  maps:
    iso-27001: ["A.5.10", "A.6.2", "A.7.7"]
    soc2: ["CC1.1"]
    cis-v8-ig1: ["14.1"]
  body: |
    # Acceptable Use Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Using company systems
    - Company devices, accounts and data are for business use. Limited personal use is allowed if it does not interfere with work, break the law or put data at risk.
    - Use only your own account. Never share passwords or MFA codes, and never let anyone use a device while you are signed in.
    - Lock your screen when you step away (Windows+L / Ctrl+Cmd+Q). Devices lock automatically after 15 minutes.

    ## Software and settings
    - Install software only from the company software catalogue or with IT approval.
    - Do not disable or bypass malware protection, firewalls, updates or other security settings.

    ## Email, web and messaging
    - Treat unexpected links and attachments with suspicion; report suspicious messages with the Report button or to {{securityContact}}.
    - Do not use personal email or file-sharing services for company data.
    - Do not access illegal, offensive or malicious content.

    ## Data
    - Store company data only in approved locations (for example OneDrive/SharePoint), never on personal devices or USB drives unless approved and encrypted.
    - Share data only with people who need it, using approved methods.

    ## Monitoring
    {{organisation}} monitors its systems for security purposes, in line with the law and our privacy notice.

    ## Breaches
    Report lost devices, suspected compromise or mistakes immediately. Misuse may lead to disciplinary action.
- key: access-control
  title: Access Control Policy
  summary: Joiners, movers and leavers; least privilege; admin accounts; access reviews.
  maps:
    iso-27001: ["A.5.15", "A.5.16", "A.5.18", "A.8.2", "A.8.3", "A.8.18"]
    cyber-essentials: ["A7.1", "A7.2", "A7.3", "A7.4", "A7.5", "A7.6", "A7.7", "A7.8", "A7.9", "A5.2"]
    cis-v8-ig1: ["5.1", "5.3", "5.4", "6.1", "6.2"]
    soc2: ["CC6.1", "CC6.2", "CC6.3"]
    nist-csf-2: ["PR.AA"]
    ncsc-caf: ["B2.a", "B2.c", "B2.d"]
    cyber-essentials-plus: ["CEP-ACCESS"]
    pci-dss: ["PCI-7"]
    govs-007: ["G007-TECH"]
    nis2: ["NIS2-21i"]
  body: |
    # Access Control Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Principles
    Access is granted on a need-to-know, least-privilege basis and removed as soon as it is no longer needed.

    ## Joiners
    - Accounts are created only after a manager's approval, recorded in the service desk.
    - Each person gets their own account. Shared accounts are not allowed except documented service accounts.

    ## Movers
    Access is reviewed when someone changes role; access no longer needed is removed within 5 working days.

    ## Leavers
    Accounts are disabled on or before the last working day, sessions revoked, MFA methods removed, and company devices returned. Accounts are deleted after 30 days unless retained for a legal reason.

    ## Administrator access
    - Admin rights are given only to named people who need them, using a **separate admin account** that is never used for email or web browsing.
    - Standard user accounts do not have local administrator rights. Software installation and elevation go through Fenrir's admin request approval.
    - Admin accounts use MFA.
    - The list of admin accounts is reviewed every quarter and unused accounts are removed.

    ## Reviews
    Managers review their team's access every 6 months. Dormant accounts (45 days unused) are disabled.
- key: authentication
  title: Password and Authentication Policy
  summary: Password length, MFA everywhere, lockout, password managers and compromised credentials.
  maps:
    iso-27001: ["A.5.17", "A.8.5"]
    cyber-essentials: ["A4.2", "A4.3", "A4.4", "A5.3", "A5.5", "A5.6", "A5.7", "A5.9", "A5.10", "A7.10", "A7.11", "A7.12"]
    cis-v8-ig1: ["5.2", "6.3", "6.4", "6.5", "14.3"]
    ncsc-caf: ["B2.a"]
    pci-dss: ["PCI-8"]
    nis2: ["NIS2-21j"]
  body: |
    # Password and Authentication Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Multi-factor authentication
    MFA is required on every cloud service that supports it, for every user, and always for administrators, remote access and internet-facing applications. Authenticator apps, passkeys or security keys are preferred to SMS.

    ## Passwords
    - At least **12 characters**; a passphrase of three or more random words is recommended.
    - Common and breached passwords are blocked.
    - Never reuse a work password anywhere else, and never share it.
    - Use the company password manager to generate and store passwords.
    - Passwords are not forced to expire on a schedule; they are changed immediately if they may be compromised.

    ## Default passwords
    Default and vendor passwords on every device, router, firewall and application are changed before use.

    ## Brute-force protection
    Accounts lock or throttle after no more than 10 failed attempts. Device unlocking uses a PIN of at least 6 digits, a password or biometrics, with lockout after repeated failures.

    ## Compromised credentials
    If you think a password or MFA method is compromised, change it and tell {{securityContact}} straight away. IT will reset it, revoke sessions and review activity.
- key: asset-management
  title: Asset Management Policy
  summary: Inventory of devices, software, data and cloud services; owners; return and disposal.
  maps:
    iso-27001: ["A.5.9", "A.5.11", "A.5.12", "A.5.13", "A.7.10", "A.7.14"]
    cyber-essentials: ["A2.4", "A2.5", "A2.6", "A2.8", "A2.9"]
    cis-v8-ig1: ["1.1", "1.2", "2.1", "2.2", "2.3", "15.1"]
