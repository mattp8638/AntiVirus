    ncsc-caf: ["B6.a", "B6.b"]
    govs-007: ["G007-PEOPLE"]
    nis2: ["NIS2-21g"]
  body: |
    # People Security Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Before joining
    Identity, right to work and references are checked for every new starter; roles with access to sensitive data have checks in proportion to the risk.

    ## Terms
    Contracts and contractor agreements include confidentiality and information security responsibilities. Third parties sign a non-disclosure agreement before receiving confidential information.

    ## Training
    Everyone completes security awareness training when they join and at least yearly, covering phishing and social engineering, passwords and MFA, data handling, reporting incidents, updates and safe use of networks. Simulated phishing exercises are run periodically. Completion is recorded.

    ## Disciplinary process
    Breaches of security policy are handled through the disciplinary process.

    ## Leaving or changing role
    Access is removed and equipment returned as set out in the Access Control Policy. Confidentiality obligations continue after employment ends.
- key: physical-security
  title: Physical Security Policy
  summary: Premises, entry control, visitors, clear desk and screen, equipment protection.
  maps:
    iso-27001: ["A.7.1", "A.7.2", "A.7.3", "A.7.4", "A.7.5", "A.7.6", "A.7.7", "A.7.8", "A.7.12", "A.7.13"]
    soc2: ["CC6.4"]
    govs-007: ["G007-PHYSICAL"]
    pci-dss: ["PCI-9"]
  body: |
    # Physical Security Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Premises
    Offices are protected by locked doors and an access control or key system. Server and network equipment is kept in a locked room or cabinet with access limited to authorised staff.

    ## Visitors
    Visitors sign in, are accompanied in non-public areas and return visitor badges when they leave.

    ## Clear desk and clear screen
    Confidential papers and removable media are locked away when not in use and at the end of the day. Screens are locked when unattended and positioned so they cannot be overlooked.

    ## Equipment
    Equipment is protected from theft, power loss (UPS for key systems), heat and water. Maintenance is done by authorised people and recorded.
- key: secure-development
  title: Secure Development Policy
  summary: For organisations that build software - secure SDLC, code review, testing, environments and source code access.
  maps:
    iso-27001: ["A.8.4", "A.8.25", "A.8.26", "A.8.27", "A.8.28", "A.8.29", "A.8.30", "A.8.31", "A.8.33", "A.5.8"]
    nist-csf-2: ["PR.PS"]
    ncsc-caf: ["A4.b", "B4.a"]
    nis2: ["NIS2-21e"]
  body: |
    # Secure Development Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Requirements and design
    Security and privacy requirements are defined for every project, and designs follow secure engineering principles (least privilege, defence in depth, secure defaults). Threat modelling is used for significant features.

    ## Coding and review
    Developers follow secure coding guidance (for example OWASP Top 10). Every change is peer-reviewed before merge; secrets are never committed to source control.

    ## Testing
    Automated tests, dependency and vulnerability scanning and static analysis run in the build pipeline. Significant releases receive security testing before go-live.

    ## Environments and data
    Development, test and production are separated. Production personal data is not used for testing unless masked or approved.

    ## Source code
    Access to source code repositories is limited to authorised people, uses MFA and is logged.

    ## Outsourced development
    Outsourced developers follow this policy through contract terms, and their work is reviewed.
- key: isms-manual
  title: ISMS Manual (scope, internal audit and management review)
  summary: How the management system runs - context and scope, documents, objectives, internal audit, management review and corrective action.
  maps:
    iso-27001: ["4.1", "4.2", "4.3", "4.4", "7.1", "7.4", "7.5", "8.1", "9.1", "9.2", "9.3", "10.1", "10.2", "A.5.3", "A.5.5", "A.5.6", "A.5.14", "A.5.31", "A.5.32", "A.5.35", "A.5.37"]
    soc2: ["CC1.2", "CC2.1", "CC2.3", "CC4.1", "CC4.2", "CC5.1"]
    nist-csf-2: ["GV.OC", "GV.OV"]
    ncsc-caf: ["A2.c"]
    uk-gdpr: ["Art.32"]
    govassure: ["GA-3","GA-REVIEW"]
    govs-007: ["G007-REVIEW"]
    dora: ["DORA-REVIEW"]
  body: |
    # ISMS Manual

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## 1. Context and interested parties
    {{organisation}} records the internal and external issues that affect information security (business strategy, technology, legal and regulatory change, threat landscape) and the requirements of interested parties (customers, staff, regulators, insurers, suppliers). Both are reviewed at each management review.

    ## 2. Scope
    The ISMS covers all people, locations, devices, networks and cloud services used to deliver {{organisation}}'s services, except as documented in the scope statement.

    ## 3. Documented information
    Policies, procedures and records are kept in Fenrir with a version history, owner, approval and review date. Approved policies are published to staff; superseded versions are retained. Records are protected from unauthorised change.

    ## 4. Objectives and measurement
    Security objectives are set each year with measurable targets (for example patch compliance, MFA coverage, training completion, time to resolve high alerts) and reported monthly.

    ## 5. Operating procedures
    Operating procedures for IT administration, backups, patching and incident handling are documented and available to those who need them.

    ## 6. Contacts and information transfer
    {{organisation}} keeps contacts with relevant authorities (ICO, NCSC, Action Fraud, police) and security interest groups. Information is transferred only through approved, secure methods under agreed terms.

    ## 7. Legal and contractual requirements
    Applicable laws, regulations and contractual obligations (including data protection, intellectual property and software licensing) are recorded with how each is met.

    ## 8. Internal audit
    An internal audit programme covers the whole ISMS at least every year, carried out by people independent of the area audited. Findings are reported to management.

    ## 9. Management review
    Top management reviews the ISMS at least yearly, considering: actions from previous reviews, changes in context, performance and objectives, audit results, incidents, risk assessment results and opportunities for improvement. Decisions are minuted.

    ## 10. Nonconformity and improvement
    Nonconformities are recorded, their root cause found, and corrective actions tracked to completion. Independent reviews of the ISMS take place at planned intervals or after significant change.
