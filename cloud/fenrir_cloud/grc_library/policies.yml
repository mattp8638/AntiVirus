    ncsc-caf: ["A3.a", "B3.e"]
    def-stan-05-138: ["CSM-SCOPE"]
    dora: ["DORA-RISK"]
  body: |
    # Asset Management Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Inventory
    {{organisation}} keeps an up-to-date inventory of:
    - end-user devices, servers, mobile devices and network equipment (maintained automatically by the Fenrir agent);
    - installed software and its version;
    - cloud services and the data they hold;
    - key information assets and their owners.

    The inventory is reviewed at least every 6 months. Unknown or unauthorised devices are removed from the network or quarantined.

    ## Ownership and classification
    Every information asset has an owner. Information is classified as **Public**, **Internal**, **Confidential** or **Restricted**, and handled according to the Data Protection Policy.

    ## Software
    Only licensed, vendor-supported software is allowed. Unauthorised or unsupported software is removed.

    ## Return and disposal
    Leavers return all company equipment. Devices and media are securely wiped (or physically destroyed) before reuse or disposal, using a certified provider where needed, and the disposal is recorded.
- key: patch-vulnerability
  title: Patch and Vulnerability Management Policy
  summary: Supported software only, critical patches within 14 days, scanning and risk-based remediation.
  maps:
    iso-27001: ["A.8.8", "A.8.19"]
    cyber-essentials: ["A6.1", "A6.2", "A6.3", "A6.4", "A6.4.1", "A6.5", "A6.5.1", "A6.6"]
    cis-v8-ig1: ["7.1", "7.2", "7.3", "7.4", "12.1", "9.1"]
    nist-csf-2: ["ID.RA", "PR.PS"]
    soc2: ["CC7.1"]
    ncsc-caf: ["B4.d"]
    cyber-essentials-plus: ["CEP-PATCH"]
    pci-dss: ["PCI-6"]
    nis2: ["NIS2-21e"]
  body: |
    # Patch and Vulnerability Management Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Supported software only
    Operating systems, firmware and applications must be licensed and supported by their vendor. Software that reaches end of support is upgraded or removed before that date, or isolated and excluded from scope with written approval.

    ## Update timescales
    | Severity | Target |
    |---|---|
    | Critical or high (CVSS 7.0+), or vendor "critical"/"high" | **within 14 days** of release |
    | Known exploited in the wild (CISA KEV) or internet-facing with a working exploit | within 48 hours |
    | Medium | within 30 days |
    | Low | next scheduled cycle |

    Automatic updates are enabled wherever possible. Fenrir applies Windows and third-party updates on the agreed schedule and reports compliance.

    ## Vulnerability scanning
    Fenrir continuously identifies missing updates and vulnerable software on every device, using CVE, EPSS and CISA KEV data to prioritise. Internet-facing services are scanned at least monthly.

    ## Exceptions
    A vulnerability that cannot be fixed in time is risk-assessed, mitigated where possible, and accepted in writing by {{owner}} with a review date.
- key: malware-protection
  title: Malware Protection Policy
  summary: Anti-malware on every device, kept current, scanning on access, web protection and application control.
  maps:
    iso-27001: ["A.8.7", "A.8.23"]
    cyber-essentials: ["A8.1", "A8.2", "A8.3", "A8.4", "A8.5", "A5.8"]
    cis-v8-ig1: ["10.1", "10.2", "10.3", "9.2"]
    soc2: ["CC6.8"]
    nist-csf-2: ["DE.CM"]
    cyber-essentials-plus: ["CEP-MALWARE"]
    pci-dss: ["PCI-5"]
  body: |
    # Malware Protection Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Protection on every device
    Every desktop, laptop and server runs Fenrir Endpoint with real-time protection, behaviour monitoring and ransomware protection. Mobile devices install apps only from the official app stores.

    ## Configuration
    - Signatures and detection models update automatically, at least daily.
    - Files are scanned when opened, downloaded or written; web pages and downloads are checked and known malicious websites are blocked (web and DNS protection).
    - Auto-run and auto-play are disabled for removable media.
    - Office macros from the internet are blocked; Office applications cannot launch scripting tools.
    - Users cannot disable protection (tamper protection is on).

    ## Application control
    Where enabled, only approved, signed applications may run, and software cannot run from user-writable folders.

    ## Response
    Detections are reviewed by the security team. Infected devices are isolated, cleaned or rebuilt, and the incident process is followed.
- key: network-security
  title: Firewall and Network Security Policy
  summary: Boundary and host firewalls, inbound rules with business justification, remote admin, segregation, Wi-Fi.
  maps:
    iso-27001: ["A.8.20", "A.8.21", "A.8.22"]
    cyber-essentials: ["A4.1", "A4.5", "A4.6", "A4.7", "A4.8", "A4.9", "A2.7"]
    cis-v8-ig1: ["4.4", "4.5", "4.2"]
    soc2: ["CC6.6"]
    nist-csf-2: ["PR.IR"]
    ncsc-caf: ["B4.c", "B5.b", "B3.b"]
    pci-dss: ["PCI-1"]
    cyber-essentials-plus: ["CEP-EXTERNAL"]
  body: |
    # Firewall and Network Security Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Firewalls
    - Every network connected to the internet is protected by a boundary firewall.
    - Every laptop and desktop runs a host firewall that blocks unsolicited inbound connections, so devices stay protected on home and public networks.
    - Firewall default passwords are changed to strong unique passwords before use.

    ## Rules
    - Inbound access from the internet is denied by default. Each open service has a documented business reason, owner and approval, and is reviewed at least every 6 months.
    - Rules no longer needed are removed immediately.

    ## Administration
    Firewall and router management interfaces are not reachable from the internet, or are protected by MFA and an IP allow list.

    ## Segregation and Wi-Fi
    Guest Wi-Fi is separated from the business network. Wi-Fi uses WPA2-Enterprise or WPA3, or WPA2/3-Personal with a strong key changed when staff with access leave. Servers and sensitive systems are segregated where practical.

    ## Remote working
    Staff connect through secure, MFA-protected cloud services or VPN.
- key: secure-configuration
  title: Secure Configuration Policy
  summary: Hardened baselines, removal of unnecessary software and accounts, session locking, configuration management.
  maps:
    iso-27001: ["A.8.9", "A.8.1"]
    cyber-essentials: ["A5.1", "A5.2", "A5.3", "A5.4", "A5.8", "A5.9"]
    cis-v8-ig1: ["4.1", "4.3", "4.6", "4.7"]
    nist-csf-2: ["PR.PS"]
    soc2: ["CC5.2", "CC7.1"]
    ncsc-caf: ["B4.b", "B2.b"]
    cyber-essentials-plus: ["CEP-INTERNAL"]
    pci-dss: ["PCI-2"]
  body: |
    # Secure Configuration Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Baselines
    Devices are built from a documented secure baseline (Fenrir security policy plus CIS-aligned settings) before they are issued, and configuration drift is monitored.

    ## Minimise what is installed
    Software, services, accounts and features that are not needed are removed or disabled, including guest accounts and sample applications.

    ## Defaults
    Default passwords are changed and default accounts disabled before devices or software are used.

    ## Locking and encryption
    Screens lock after 15 minutes (2 minutes on mobiles). Laptops and mobiles are encrypted (BitLocker, FileVault, device encryption) with recovery keys escrowed.

    ## Internet-facing services
    Any service reachable from the internet requires authentication and is protected by MFA or brute-force protection.

    ## Changes
    Configuration changes follow the Change Management Policy.
- key: backup-recovery
  title: Backup and Recovery Policy
  summary: What is backed up, how often, isolation, encryption and restore testing.
  maps:
    iso-27001: ["A.8.13", "A.8.14"]
    cis-v8-ig1: ["11.1", "11.2", "11.3", "11.4"]
    nist-csf-2: ["PR.DS", "RC.RP"]
    ncsc-caf: ["B5.c"]
    soc2: ["CC9.1"]
    nis2: ["NIS2-21c"]
    dora: ["DORA-DETECT"]
  body: |
    # Backup and Recovery Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Scope and frequency
    | Data | Frequency | Retention |
    |---|---|---|
    | Servers and line-of-business systems | daily | 30 days daily, 12 months monthly |
    | Microsoft 365 (mail, OneDrive, SharePoint, Teams) | daily | 12 months |
    | Device configuration | on change | current + previous |

    ## Protection
    Backups are encrypted in transit and at rest. At least one copy is **isolated** (immutable, offline or in a separate account) so ransomware or an attacker with admin access cannot delete it. Standard users cannot modify or delete backups.

    ## Monitoring and testing
    Backup jobs are monitored daily and failures fixed within one working day. A restore test is performed at least every quarter and a full recovery exercise at least yearly; results are recorded.

    ## Recovery objectives
    Recovery time and recovery point objectives for each system are agreed with the business and recorded in the Business Continuity Plan.
- key: incident-response
  title: Incident Response Policy and Plan
  summary: Reporting, triage, roles, containment, communication, breach notification and lessons learned.
  maps:
    iso-27001: ["A.5.24", "A.5.25", "A.5.26", "A.5.27", "A.5.28", "A.6.8", "A.5.5"]
    cis-v8-ig1: ["17.1", "17.2", "17.3", "14.6"]
    nist-csf-2: ["RS.MA", "RS.AN", "RS.CO", "RS.MI", "ID.IM", "DE.AE"]
    soc2: ["CC7.3", "CC7.4", "CC7.5"]
    uk-gdpr: ["Art.33-34"]
    ncsc-caf: ["D1.a", "D1.b", "D1.c", "D2.a", "D2.b", "C1.d"]
    def-stan-05-138: ["CSM-INCIDENT"]
    govs-007: ["G007-INCIDENT"]
    eu-gdpr: ["GDPR-BREACH"]
    nis2: ["NIS2-21b","NIS2-23"]
    dora: ["DORA-INCIDENT","DORA-DETECT"]
  body: |
    # Incident Response Policy and Plan

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Reporting
    Anyone who suspects an incident - a phishing click, a lost device, unusual account activity, a ransomware note - reports it **immediately** to {{securityContact}}. Do not try to investigate yourself or turn the device off.

    ## Roles
    - **Incident lead:** {{owner}} (deputy named in the contact list)
    - **Technical response:** IT / managed service provider (Fenrir SOC)
    - **Communications and legal:** senior management, DPO, insurer

    ## Process
    1. **Detect and triage** - confirm the incident, assign a severity (low/medium/high/critical) and an incident lead.
    2. **Contain** - isolate affected devices (Fenrir network isolation), disable compromised accounts, revoke sessions, block indicators.
    3. **Eradicate and recover** - remove the cause, rebuild or restore from clean backups, reset credentials.
    4. **Communicate** - keep management informed; notify customers, the insurer and authorities as required.
    5. **Learn** - within 10 working days, a review records the root cause and improvement actions.

    ## Personal data breaches
    If personal data is involved, the DPO assesses the risk. Notifiable breaches are reported to the ICO **within 72 hours** of becoming aware, and affected people are told without undue delay when the risk to them is high. All breaches are logged.

    ## Evidence
    Logs, forensic bundles and records are preserved and access to them is controlled.

    ## Testing
    The plan is tested at least yearly with a tabletop exercise.
- key: business-continuity
  title: Business Continuity and Disaster Recovery Policy
  summary: Business impact, recovery objectives, continuity plans and exercising.
  maps:
    iso-27001: ["A.5.29", "A.5.30", "A.7.11"]
    soc2: ["CC9.1", "CC7.5"]
    nist-csf-2: ["RC.RP", "RC.CO"]
    ncsc-caf: ["B5.a", "B5.b"]
    nis2: ["NIS2-21c"]
    dora: ["DORA-EXIT"]
  body: |
    # Business Continuity and Disaster Recovery Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Business impact
    Critical activities, the systems and suppliers they depend on, and how long the business can tolerate their loss are recorded in a business impact analysis, reviewed yearly.

    ## Recovery objectives
    Each critical system has a recovery time objective (RTO) and recovery point objective (RPO). Backups and redundancy are designed to meet them.

    ## Plans
    Continuity plans cover loss of premises, loss of key systems or suppliers, cyber attack (including ransomware) and loss of key staff, with contact lists and step-by-step recovery.

    ## Security during disruption
    Security controls are maintained during a disruption; any temporary relaxation is approved and reversed afterwards.

    ## Exercising
    Plans are exercised at least yearly and updated with the lessons learned.
- key: supplier-security
  title: Supplier and Cloud Security Policy
  summary: Supplier due diligence, contract terms, cloud services, monitoring and offboarding.
  maps:
    iso-27001: ["A.5.19", "A.5.20", "A.5.21", "A.5.22", "A.5.23"]
    nist-csf-2: ["GV.SC"]
    soc2: ["CC9.2"]
    cis-v8-ig1: ["15.1"]
    uk-gdpr: ["Art.28"]
    ncsc-caf: ["A4.a"]
    def-stan-05-138: ["CSM-FLOWDOWN","CSM-REVIEW"]
    govs-007: ["G007-SUPPLIERS"]
    eu-gdpr: ["GDPR-PROCESSORS"]
    nis2: ["NIS2-21d"]
    dora: ["DORA-THIRD"]
  body: |
    # Supplier and Cloud Security Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Due diligence
    Before engaging a supplier that will access our systems or data, we assess its security (certifications such as ISO 27001, SOC 2 or Cyber Essentials, or a security questionnaire) in proportion to the risk.

    ## Contracts
    Contracts include confidentiality, security requirements, breach notification, right to audit, sub-processor controls, data return and deletion, and the UK GDPR Article 28 terms where the supplier processes personal data.

    ## Cloud services
    Cloud services are approved before use, configured securely (MFA, least privilege, logging) and listed in the asset inventory. Data location and exit arrangements are known.

    ## Monitoring
    Critical suppliers are reviewed at least yearly; changes to their services are assessed.

    ## Offboarding
    When a supplier relationship ends, access is removed and data is returned or certified deleted.
- key: data-protection
  title: Data Protection and Privacy Policy
  summary: UK GDPR principles, lawful basis, rights requests, ROPA, DPIAs, transfers and DPO.
  maps:
    iso-27001: ["A.5.34", "A.5.31"]
    uk-gdpr: ["Art.5(1)(a)", "Art.5(1)(b)", "Art.5(1)(c)", "Art.5(1)(d)", "Art.5(1)(f)", "Art.5(2)", "Art.6", "Art.7", "Art.9", "Art.13-14", "Art.15", "Art.16-17", "Art.18-21", "Art.22", "Art.25", "Art.30", "Art.35", "Art.37-39", "Art.44-49", "ICO-FEE"]
    cis-v8-ig1: ["3.1", "3.2", "3.3", "14.4", "14.5"]
    ncsc-caf: ["B3.a"]
    eu-gdpr: ["GDPR-LAWFUL","GDPR-RIGHTS","GDPR-DPIA","GDPR-SECURITY","GDPR-TRANSFERS"]
  body: |
    # Data Protection and Privacy Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Principles
    {{organisation}} processes personal data lawfully, fairly and transparently; for specified purposes; limited to what is necessary; accurately; for no longer than needed; and securely. We can demonstrate how we comply.

    ## Accountability
    - We keep a **record of processing activities** with the lawful basis for each.
    - We publish privacy notices explaining how we use personal data.
    - We pay the ICO data protection fee.
    - A data protection lead (or DPO, where required) advises and monitors compliance.

    ## Individuals' rights
    Requests (access, rectification, erasure, restriction, portability, objection) are logged and answered within one month. Staff forward any request to the data protection lead the same day.

    ## By design
    New systems and processes consider data protection from the start. A **DPIA** is completed before high-risk processing.

    ## Sharing and transfers
    Personal data is shared only with authorised parties under contract. Transfers outside the UK use adequacy regulations or approved safeguards (IDTA or the UK Addendum).

    ## Security and breaches
    Personal data is protected by the controls in our information security policies. Breaches are handled under the Incident Response Policy, including the 72-hour ICO notification.
- key: data-retention
  title: Data Retention and Disposal Policy
  summary: How long each kind of data is kept and how it is securely deleted.
  maps:
    iso-27001: ["A.5.33", "A.8.10"]
    uk-gdpr: ["Art.5(1)(e)"]
    cis-v8-ig1: ["3.4", "3.5"]
    eu-gdpr: ["GDPR-RETENTION"]
    pci-dss: ["PCI-3"]
  body: |
    # Data Retention and Disposal Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Retention schedule
    | Record | Retention | Basis |
    |---|---|---|
    | Customer contracts and invoices | 6 years after the end of the contract | Limitation Act / HMRC |
    | Employee records | 6 years after employment ends | Employment law |
    | Recruitment records (unsuccessful) | 6 months | Equality Act claims period |
    | Marketing consent records | while consent is valid + 2 years | Accountability |
    | Security logs | 12 months | Incident investigation |
    | Backups | per Backup Policy | Recovery |

    Records are kept no longer than the schedule allows unless a legal hold applies.

    ## Disposal
    Electronic data is deleted from systems and backups by the end of the retention period. Paper is cross-cut shredded or securely destroyed. Devices and media are wiped or destroyed as set out in the Asset Management Policy, and disposals are recorded.
- key: remote-mobile
  title: Remote Working and Mobile Device Policy
  summary: Working from home and on the move, BYOD, lost devices and public networks.
  maps:
    iso-27001: ["A.6.7", "A.7.9", "A.8.1"]
    cyber-essentials: ["A2.6", "A2.7"]
    cis-v8-ig1: ["3.6", "14.8"]
    ncsc-caf: ["B3.d", "B2.b"]
  body: |
    # Remote Working and Mobile Device Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Working remotely
    - Use company devices with Fenrir Endpoint installed. Keep them updated and locked when unattended.
    - Work where others cannot see your screen or overhear confidential calls.
    - Home Wi-Fi uses WPA2 or WPA3 with a strong password; the router's default admin password has been changed.
    - On public Wi-Fi, use only HTTPS services and the company VPN where provided.

    ## Mobile phones and tablets
    - Devices that access company email or data are enrolled with Fenrir, run a supported OS, use a PIN of at least 6 digits or biometrics, and are encrypted.
    - Apps are installed only from the official app stores.
    - Personal devices (BYOD) may access company data only through approved apps and must allow the company data to be wiped.

    ## Lost or stolen devices
    Report a lost or stolen device to {{securityContact}} **immediately**. IT will lock, locate or wipe it and revoke its sessions.
- key: cryptography
  title: Cryptography Policy
  summary: Encryption at rest and in transit, approved algorithms and key management.
  maps:
    iso-27001: ["A.8.24"]
    cis-v8-ig1: ["3.6"]
    ncsc-caf: ["B3.b", "B3.c"]
    pci-dss: ["PCI-4"]
    nis2: ["NIS2-21h"]
  body: |
    # Cryptography Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## In transit
    Data crossing untrusted networks is encrypted with TLS 1.2 or later. Insecure protocols (Telnet, FTP, SMBv1, SSLv3/TLS 1.0) are disabled.

    ## At rest
    Laptops, mobile devices and removable media holding company data are encrypted (BitLocker, FileVault, device encryption). Backups and sensitive databases are encrypted.

    ## Algorithms
    Use current, vendor-supported algorithms (for example AES-256, RSA 3072+/ECDSA P-256+, SHA-256+). Do not create custom cryptography.

    ## Keys and certificates
    Keys and recovery keys are stored in approved vaults (Fenrir credential vault, Entra ID/Intune escrow), access is limited and logged, and certificates are renewed before expiry. Keys are rotated or revoked if compromise is suspected.
- key: logging-monitoring
  title: Logging and Monitoring Policy
  summary: What is logged, protection and retention of logs, monitoring, alerting and clock sync.
  maps:
    iso-27001: ["A.8.15", "A.8.16", "A.8.17", "A.5.7"]
    cis-v8-ig1: ["8.1", "8.2", "8.3"]
    nist-csf-2: ["DE.CM", "DE.AE"]
    soc2: ["CC7.2", "CC4.1"]
    ncsc-caf: ["C1.a", "C1.b", "C1.c", "C1.e", "C2.a", "C2.b"]
    pci-dss: ["PCI-10"]
    dora: ["DORA-DETECT"]
  body: |
    # Logging and Monitoring Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## What is logged
    Security-relevant events from endpoints (process, network, file and registry activity collected by Fenrir EDR), servers, domain controllers (account, group and Kerberos events), firewalls and cloud services (Microsoft 365 sign-in and audit logs).

    ## Protection and retention
    Logs are sent to a central system, protected from alteration and deletion, and retained for at least 12 months (90 days readily searchable). Access to logs is restricted.

    ## Monitoring
    Detection rules mapped to MITRE ATT&CK run continuously. Alerts are triaged by the security team; high and critical alerts are investigated the same working day. Rules are tuned to keep false positives low.

    ## Time
    All systems synchronise their clocks with a trusted time source so events can be correlated.

    ## Threat intelligence
    Threat intelligence (indicators, known-exploited vulnerabilities) is used to improve detection and patching priorities.
- key: change-management
  title: Change Management Policy
  summary: Requesting, assessing, approving, testing and recording changes; emergency changes.
  maps:
    iso-27001: ["A.8.32", "6.3", "A.8.31"]
    soc2: ["CC8.1", "CC3.4"]
    ncsc-caf: ["B4.c"]
  body: |
    # Change Management Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Standard changes
    Pre-approved, low-risk, repeatable changes (for example routine patching through Fenrir) follow their documented procedure.

    ## Normal changes
    Other changes to systems, networks and cloud services are requested in the service desk with: description, reason, risk and security impact, test plan, back-out plan and timing. They are approved by the system owner (and the change board for significant changes) before implementation.

    ## Emergency changes
    Urgent changes (for example to contain an incident) may be made with verbal approval from {{owner}} and are recorded and reviewed within two working days.

    ## Testing and environments
    Changes are tested before production where possible. Development, test and production are separated.

    ## Records
    Every change is recorded with who made it, when and the result.
- key: risk-management
  title: Risk Management Policy
  summary: Risk assessment method, risk register, treatment, acceptance and review.
  maps:
    iso-27001: ["6.1.1", "6.1.2", "6.1.3", "8.2", "8.3"]
    soc2: ["CC3.1", "CC3.2", "CC3.3", "CC9.1"]
    nist-csf-2: ["GV.RM", "ID.RA", "GV.OV"]
    ncsc-caf: ["A2.a", "A1.c"]
    govassure: ["GA-5"]
    govs-007: ["G007-RISK"]
    nis2: ["NIS2-21a","NIS2-21f"]
    dora: ["DORA-RISK","DORA-TEST"]
  body: |
    # Risk Management Policy

    **Organisation:** {{organisation}}  **Owner:** {{owner}}  **Review:** every {{reviewMonths}} months

    ## Method
    Risks to information are identified (threats, vulnerabilities, assets) and scored on **likelihood (1-5) x impact (1-5)**. Scores of 15 or more are high, 8-14 medium, below 8 low.

    ## Risk register
    Every risk has an owner, a score, existing controls, a treatment decision and a review date, recorded in the Fenrir risk register.

    ## Treatment
    Risks are treated by reducing (adding controls), avoiding, transferring (insurance, contracts) or accepting them. Risks above our appetite (medium) need a treatment plan.

    ## Acceptance
    Only the risk owner, with {{owner}}'s agreement, may accept a risk, in writing, with a review date no more than 12 months away.

    ## Review
    The register is reviewed at least quarterly, after significant changes and after incidents, and summarised for management review.
- key: hr-security
  title: People Security Policy (joiners, training and leavers)
  summary: Screening, contracts and NDAs, awareness training, disciplinary process and leavers.
  maps:
    iso-27001: ["A.6.1", "A.6.2", "A.6.3", "A.6.4", "A.6.5", "A.6.6", "7.2", "7.3"]
    cis-v8-ig1: ["14.1", "14.2", "14.3", "14.4", "14.5", "14.6", "14.7", "14.8"]
