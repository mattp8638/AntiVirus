key: uk-gdpr
name: UK GDPR and Data Protection Act 2018
short: UK GDPR
version: "2018 (as amended)"
description: What UK data protection law expects of an organisation that controls or processes personal data. Article references are to the UK GDPR.
sections:
  - id: PRIN
    title: "Principles and accountability"
    requirements:
      - [ "Art.5(1)(a)", "Lawful, fair and transparent processing", "Process personal data lawfully, fairly and transparently." ]
      - [ "Art.5(1)(b)", "Purpose limitation", "Collect for specified, explicit and legitimate purposes and do not reuse incompatibly." ]
      - [ "Art.5(1)(c)", "Data minimisation", "Keep personal data adequate, relevant and limited to what is necessary." ]
      - [ "Art.5(1)(d)", "Accuracy", "Keep personal data accurate and up to date; correct or erase inaccurate data promptly." ]
      - [ "Art.5(1)(e)", "Storage limitation", "Keep data no longer than necessary, with defined retention periods." ]
      - [ "Art.5(1)(f)", "Integrity and confidentiality", "Protect personal data with appropriate security against unauthorised processing, loss and damage." ]
      - [ "Art.5(2)", "Accountability", "Be able to demonstrate compliance with the principles." ]
      - [ "ICO-FEE", "ICO registration", "Pay the data protection fee to the ICO (unless exempt) and keep the registration current." ]
  - id: BASIS
    title: "Lawful basis and transparency"
    requirements:
      - [ "Art.6", "Lawful basis identified", "Identify and document the lawful basis for each processing activity." ]
      - [ "Art.7", "Valid consent", "Where consent is used, it is freely given, specific, informed, unambiguous, recorded and easy to withdraw." ]
      - [ "Art.9", "Special category data", "Identify special category data and the additional condition relied on." ]
      - [ "Art.13-14", "Privacy notices", "Give individuals the required information when collecting their data (privacy notice)." ]
  - id: RIGHTS
    title: "Individuals' rights"
    requirements:
      - [ "Art.15", "Right of access", "Respond to subject access requests within one month." ]
      - [ "Art.16-17", "Rectification and erasure", "Correct inaccurate data and erase data when the right applies." ]
      - [ "Art.18-21", "Restriction, portability and objection", "Handle requests to restrict, port or object to processing." ]
      - [ "Art.22", "Automated decision-making", "Identify automated decisions with legal or similar effects and provide safeguards." ]
  - id: OPS
    title: "Governance and security"
    requirements:
      - [ "Art.25", "Data protection by design and default", "Build data protection into systems and processes from the start." ]
      - [ "Art.28", "Processor contracts", "Have written contracts with processors containing the Article 28 terms." ]
      - [ "Art.30", "Records of processing activities", "Maintain a record of processing activities (ROPA)." ]
      - [ "Art.32", "Security of processing", "Implement appropriate technical and organisational security measures, tested regularly.", [], ["iso-27001/A.8.7", "iso-27001/A.8.8"] ]
      - [ "Art.33-34", "Personal data breaches", "Report notifiable breaches to the ICO within 72 hours, tell affected people when the risk is high, and log all breaches." ]
      - [ "Art.35", "Data protection impact assessments", "Carry out a DPIA before high-risk processing." ]
      - [ "Art.37-39", "Data protection officer", "Appoint a DPO where required and support their role." ]
      - [ "Art.44-49", "International transfers", "Transfer personal data outside the UK only with adequacy, appropriate safeguards (IDTA/Addendum) or an exception." ]
