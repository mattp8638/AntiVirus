set default=0
set timeout=5
insmod all_video
insmod gfxterm
terminal_output console

menuentry "Fenrir-Backup recovery" {
	linux /live/vmlinuz boot=live components quiet console=tty0 console=ttyS0,115200n8 systemd.show_status=auto
	initrd /live/initrd.img
}
menuentry "Fenrir-Backup recovery (copy to RAM, then the medium can be removed)" {
	linux /live/vmlinuz boot=live components quiet toram console=tty0 console=ttyS0,115200n8
	initrd /live/initrd.img
}
menuentry "Fenrir-Backup recovery (safe graphics)" {
	linux /live/vmlinuz boot=live components nomodeset console=tty0 console=ttyS0,115200n8
	initrd /live/initrd.img
}
