[package]
name = "agent"
description = "fenrir-backup-agent: Fenrir-Backup agent for Windows, Hyper-V hosts, Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fenrir-backup-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
core-format.workspace = true
engine.workspace = true
filebrowse.workspace = true
scan.workspace = true
filebackup.workspace = true
nbd-server.workspace = true
hex.workspace = true
k8s.workspace = true
saas.workspace = true
protocol.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
s3store.workspace = true
azstore.workspace = true
snapshot-linux.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "proxy-from-env"] }
uuid.workspace = true
vdisk.workspace = true
vmboot.workspace = true

[target.'cfg(windows)'.dependencies]
snapshot-win.workspace = true
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WNet", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
