name = 'signaturedb-fenrir'
main = "src/worker.ts"
compatibility_date = "2026-04-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.fenrir-security.co.uk", zone_name = "fenrir-security.co.uk", custom_domain = true }
]

[vars]
FENRIR_FEED_MAX_HASHES = "20000"
FENRIR_FEED_MAX_URLS = "10000"
FENRIR_FEED_MAX_RULES = "2000"

[[d1_databases]]
binding = "fenrir"
database_name = "apifenrir"
database_id = "0d149568-5d2c-437d-a105-0f339939a43a"
migrations_dir = "migrations/d1"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
