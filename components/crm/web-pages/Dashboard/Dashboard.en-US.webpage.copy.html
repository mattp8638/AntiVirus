<div class="crm-body-container">
  
  <!-- Breadcrumbs & Heading -->
  <div style="margin-bottom: 30px;">
    <ul class="breadcrumb" style="margin-bottom: 10px;">
      <li class="breadcrumb-item"><a href="#">Admin</a></li>
      <li class="breadcrumb-item active">Dashboard</li>
    </ul>
    <h1 style="font-size: 2.25rem; font-weight: 800; font-family: var(--font-heading); letter-spacing: -0.5px; margin: 0;">
      Welcome Back, <span style="background: linear-gradient(to right, var(--accent-blue), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" id="welcome-username">Admin</span>.
    </h1>
  </div>

  <!-- KPI Metrics Grid -->
  <div class="crm-metrics-grid" id="kpi-metrics-grid">
    <!-- Rendered dynamically by crm-config.js -->
  </div>

  <!-- Revenue Analytics Chart Card -->
  <div class="crm-card" style="margin-bottom: 40px; padding: 25px 30px;">
    <h2 style="font-size: 1.4rem; font-weight: 800; font-family: var(--font-heading); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"></path></svg>
      Revenue Analytics (Q2 2026 Trend)
    </h2>
    <div id="revenue-chart-container" style="width: 100%; height: 220px; position: relative;">
      <!-- SVG dynamic chart rendered here by customjs.js -->
    </div>
  </div>

  <!-- Main Split Dashboard Content Grid -->
  <div style="display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 40px;">
    
    <!-- Left Column: Activity Log Timeline -->
    <div class="crm-card" style="flex: 1.5; min-width: 350px;">
      <h2 style="font-size: 1.4rem; font-weight: 800; font-family: var(--font-heading); margin-bottom: 25px; display: flex; align-items: center; gap: 10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Recent Activity Timeline
      </h2>
      
      <div class="crm-timeline" id="dashboard-timeline" style="display: flex; flex-direction: column; gap: 20px; position: relative; padding-left: 20px; border-left: 2px solid var(--border-glass);">
        <!-- Rendered dynamically by crm-config.js -->
      </div>
    </div>

    <!-- Right Column: Quick Actions & Projects Milestones -->
    <div class="crm-card" style="flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 30px;">
      
      <!-- Project Tracking -->
      <div>
        <h2 style="font-size: 1.4rem; font-weight: 800; font-family: var(--font-heading); margin-bottom: 25px; display: flex; align-items: center; gap: 10px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          Active Deliverables
        </h2>
        
        <div style="display: flex; flex-direction: column; gap: 20px;" id="deliverables-list">
          <!-- Rendered dynamically by crm-config.js -->
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div style="border-top: 1px solid var(--border-glass); padding-top: 25px; margin-top: auto;">
        <h3 style="font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px;">Quick Actions</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <a href="/leads/" class="crm-btn-action" style="padding: 12px; text-align: center; border-radius: 10px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: #fff; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: block; transition: all 0.3s ease;">+ New Lead</a>
          <a href="/support/" class="crm-btn-action" style="padding: 12px; text-align: center; border-radius: 10px; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #fff; font-size: 0.85rem; font-weight: 700; text-decoration: none; display: block; transition: all 0.3s ease;">Create Ticket</a>
        </div>
      </div>

    </div>

  </div>

</div>
