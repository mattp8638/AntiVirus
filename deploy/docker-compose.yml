# Fenrir Platform: single-node deployment.
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fenrir
      POSTGRES_USER: fenrir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenrir"]
      interval: 10s

  cloud:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      FENRIR_DATABASE_URL: postgresql+psycopg://fenrir:${POSTGRES_PASSWORD}@db:5432/fenrir
      FENRIR_SECRET_KEY: ${FENRIR_SECRET_KEY:?set FENRIR_SECRET_KEY}
      FENRIR_PUBLIC_URL: ${FENRIR_PUBLIC_URL:?set FENRIR_PUBLIC_URL}
      FENRIR_ADMIN_EMAIL: ${FENRIR_ADMIN_EMAIL:-admin@fenrir.local}
      FENRIR_ADMIN_PASSWORD: ${FENRIR_ADMIN_PASSWORD:?set FENRIR_ADMIN_PASSWORD}
      FENRIR_OPEN_ENROLLMENT: ${FENRIR_OPEN_ENROLLMENT:-true}
      FENRIR_FEED_URL: ${FENRIR_FEED_URL:-https://api.fenrir-security.co.uk}
      FENRIR_FEED_TOKEN: ${FENRIR_FEED_TOKEN:-}
      FENRIR_FEED_SYNC: ${FENRIR_FEED_SYNC:-true}
      FENRIR_CORS_ORIGINS: ${FENRIR_PUBLIC_URL}
    ports: ["8080:8080"]

volumes:
  db: {}
