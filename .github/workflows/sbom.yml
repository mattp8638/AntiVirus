# Software bill of materials (SPDX and CycloneDX) for every component, plus a vulnerability scan of those
# dependencies. On a release the SBOMs are attached to it so anyone running Fenrir can check what is inside.
name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/go.sum"
      - "**/*.gradle*"
      - "deploy/Dockerfile"
      - ".github/workflows/sbom.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach SBOMs to a release
    steps:
      - uses: actions/checkout@v7
      - name: SPDX SBOM of the whole source tree
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: fenrir-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: CycloneDX SBOM of the whole source tree
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: fenrir-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan the dependencies for known vulnerabilities
        uses: anchore/scan-action@v7
        id: scan
        with:
          sbom: fenrir-source.spdx.json
          fail-build: false
          severity-cutoff: high
          output-format: table
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: fenrir-source.*.json
          retention-days: 90
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" fenrir-source.spdx.json fenrir-source.cdx.json --clobber
