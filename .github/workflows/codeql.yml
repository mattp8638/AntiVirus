# Free static analysis (GitHub CodeQL; free for public repositories). Results appear under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual  # Kotlin is only analysed while it compiles (the Android app)
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: agent/linux/go.mod
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/third_party/**"
              - "**/vendor/**"
      - name: Build the Go agent
        if: matrix.language == 'go'
        working-directory: agent/linux
        run: go build ./...
      - name: Build the Android app
        if: matrix.language == 'java-kotlin'
        working-directory: agent/android
        run: ./gradlew --no-daemon --no-build-cache assembleDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
