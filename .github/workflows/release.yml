name: Release

# Pushing a tag vX.Y.Z (a release) or vX.Y.Z-rc.N (a candidate for staging servers) runs the server and console tests
# on exactly that commit, checks the tag is on main, and publishes a GitHub release with notes. Servers following the
# "stable" or "candidate" track (deploy/auto-update.sh) deploy the tag themselves; see docs/AUTO_UPDATE.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: write

jobs:
  verify:
    name: Test the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The tag must be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Merge first, then tag main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r cloud/requirements-dev.txt
      - name: Server tests
        working-directory: cloud
        run: python -m pytest -q
      - name: Console build and tests
        working-directory: console
        env: { FENRIR_UI_TEST_LEGACY: "true" }
        run: npm ci --no-audit --no-fund && npm run build && npm run test:shapes && npm run test:remote && npm run test:pages

  publish:
    name: Publish the release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # signs the provenance with GitHub's OIDC identity (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # A source archive with SHA-256 and a signed provenance statement, so anyone can check a download came from
      # this repository's release workflow at this tag:  gh attestation verify fenrir-<tag>.tar.gz -R <owner>/<repo>
      - name: Source archive and checksum
        run: |
          git archive --format=tar.gz --prefix="fenrir-$GITHUB_REF_NAME/" -o "fenrir-$GITHUB_REF_NAME.tar.gz" "$GITHUB_SHA"
          sha256sum "fenrir-$GITHUB_REF_NAME.tar.gz" > "fenrir-$GITHUB_REF_NAME.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: fenrir-${{ github.ref_name }}.tar.gz
      - name: Create the GitHub release with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --title "Fenrir $GITHUB_REF_NAME" \
            "fenrir-$GITHUB_REF_NAME.tar.gz" "fenrir-$GITHUB_REF_NAME.tar.gz.sha256"
