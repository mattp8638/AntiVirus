name: Android agent

on:
  workflow_dispatch:
  push:
    paths: [ "agent/android/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "agent/android/**", ".github/workflows/android.yml" ]

jobs:
  build:
    name: Build and test the Fenrir Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release signing comes from repository secrets; without them the APK is signed with a throwaway debug key
      # (fine for testing, but phones can't upgrade between differently signed builds).
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.FENRIR_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fenrir-release.jks"
            echo "FENRIR_ANDROID_KEYSTORE=$RUNNER_TEMP/fenrir-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No FENRIR_ANDROID_KEYSTORE_B64 secret: building with the debug signing key"
          fi

      - name: Unit tests, lint and release build
        env:
          FENRIR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FENRIR_ANDROID_KEYSTORE_PASSWORD }}
          FENRIR_ANDROID_KEY_ALIAS: ${{ secrets.FENRIR_ANDROID_KEY_ALIAS }}
          FENRIR_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk fenrir-android.apk
          sha256sum fenrir-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-android
          path: |
            agent/android/fenrir-android.apk
            agent/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
