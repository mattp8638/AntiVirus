# OpenSSF Scorecard: checks the repository's own security practices (branch protection, pinned actions, signed
# releases, and so on). Free; results go to Security > Code scanning and to the public Scorecard site.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
