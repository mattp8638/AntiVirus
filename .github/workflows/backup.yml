name: Device backup (Rust)

# The image-backup engine, CLI and agent in backup/. The server side lives in cloud/ (fenrir_cloud/backup.py) and is
# tested by the platform workflow.
on:
  push:
    paths: ["backup/**", "cloud/fenrir_cloud/backup*.py", "cloud/fenrir_cloud/routers/backup*.py", ".github/workflows/backup.yml"]
  pull_request:
    paths: ["backup/**", "cloud/fenrir_cloud/backup*.py", "cloud/fenrir_cloud/routers/backup*.py", ".github/workflows/backup.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: backup

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: QEMU and OVMF (VHDX interop and boot-from-backup tests)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm || true
          for url in \
            https://github.com/cirros-dev/cirros/releases/download/0.6.2/cirros-0.6.2-x86_64-disk.img \
            https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img; do
            if curl -fsSL --retry 3 --connect-timeout 20 -o /tmp/cirros.img "$url" \
               && echo "${CIRROS_SHA256}  /tmp/cirros.img" | sha256sum -c; then
              qemu-img convert -O raw /tmp/cirros.img /tmp/cirros.raw
              echo "FENRIR_TEST_BOOT_IMAGE=/tmp/cirros.raw" >> "$GITHUB_ENV"
              break
            fi
          done
        env:
          CIRROS_SHA256: 07e44a73e54c94d988028515403c1ed762055e01b83a767edf3c2b387f78ce00
      - name: Azure and S3 emulators (object storage and cloud restore tests)
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/azurite" azurite@3.38.0
          python3 -m venv "$RUNNER_TEMP/moto" && "$RUNNER_TEMP/moto/bin/pip" install -q "moto[server]==5.2.6"
          echo "FENRIR_TEST_AZURE=$RUNNER_TEMP/azurite/node_modules/.bin/azurite-blob --inMemoryPersistence --skipApiVersionCheck --loose --blobHost 127.0.0.1 --blobPort" >> "$GITHUB_ENV"
          echo "FENRIR_TEST_S3=$RUNNER_TEMP/moto/bin/moto_server -p" >> "$GITHUB_ENV"
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked

  # The NAS gateway with the real platform server and two real agents: relay first, then direct.
  gateway-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build --locked -p agent
      - name: platform server requirements
        working-directory: cloud
        run: python -m pip install -r requirements.txt httpx cryptography
      - name: laptop backs up through the gateway (relay, then direct)
        working-directory: .
        run: sudo -E "$(command -v python)" backup/ci/e2e-gateway.py "$RUNNER_TEMP/e2e" "$PWD/backup/target/debug/fenrir-backup-agent" "$PWD/cloud"
      - name: logs
        if: failure()
        working-directory: .
        run: tail -n 60 "$RUNNER_TEMP"/e2e/*.log "$RUNNER_TEMP"/e2e/*/agent.log || true

  windows-vss-smoke:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p cli
      - name: backup system --dry-run (VSS)
        shell: pwsh
        run: |
          .\target\release\fenrir-backup.exe --json backup system --dry-run | Tee-Object -FilePath plan.json
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 10) { exit 1 }
          $p = Get-Content plan.json | ConvertFrom-Json
          if (-not $p.ok) { exit 1 }
          $snap = $p.result.disks.partitions | Where-Object { $_.capture -eq 'snapshot_bitmap' }
          if (-not $snap) { Write-Error 'no partition was captured through a VSS snapshot'; exit 1 }

  # Agent builds for every platform, in the folder layout the server serves from
  # (FENRIR_BACKUP_AGENTS_DIR, /app/cloud/downloads/backup in the image): <target triple>/<file>.
  build:
    name: build (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: "", musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "", musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p agent -p cli
      - name: collect
        shell: bash
        run: |
          mkdir -p out/agents/${{ matrix.target }} out/cli
          cp target/${{ matrix.target }}/release/fenrir-backup-agent${{ matrix.ext }} out/agents/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/fenrir-backup${{ matrix.ext }} out/cli/fenrir-backup-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.target }}
          path: backup/out

  # Recovery media (bare-metal restore): the Debian live ISO with the static agent and CLI. Place it at
  # <FENRIR_BACKUP_AGENTS_DIR>/recovery/fenrir-recovery.iso on the server; see docs/DEVICE_BACKUP.md.
  recovery-iso:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backup-x86_64-unknown-linux-musl
          path: bin
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap squashfs-tools xorriso mtools dosfstools
      - name: build
        working-directory: .
        run: |
          chmod +x bin/agents/x86_64-unknown-linux-musl/fenrir-backup-agent bin/cli/fenrir-backup-x86_64-unknown-linux-musl
          sudo backup/recovery-env/build.sh "$PWD/out/recovery/fenrir-recovery.iso" \
            bin/agents/x86_64-unknown-linux-musl/fenrir-backup-agent bin/cli/fenrir-backup-x86_64-unknown-linux-musl
          sudo chown -R "$USER" out
      - uses: actions/upload-artifact@v4
        with:
          name: backup-recovery-iso
          path: out

  # The shared backup code is made in Fenrir-Backup and copied here with backup/sync-upstream.py: fail if backup/
  # no longer matches the Fenrir-Backup commit pinned in backup/UPSTREAM. If that repository is private, add a
  # read-only token for it as the secret FENRIR_BACKUP_READ_TOKEN; without one the check is skipped with a warning.
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "commit=$(awk '{print $2}' UPSTREAM)" >> "$GITHUB_OUTPUT"
      - id: fetch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: zy538324/Fenrir-Backup
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
          token: ${{ secrets.FENRIR_BACKUP_READ_TOKEN || github.token }}
      - name: backup/ matches Fenrir-Backup
        if: steps.fetch.outcome == 'success'
        run: python3 sync-upstream.py ../upstream --check
      - if: steps.fetch.outcome != 'success'
        run: echo "::warning::Could not fetch Fenrir-Backup ${{ steps.pin.outputs.commit }}; drift check skipped"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny (licences, sources, advisories)
        run: cargo deny check

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz each target briefly
        working-directory: backup/fuzz
        run: |
          for t in manifest_envelope sealed_object partition_table key_files; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done
